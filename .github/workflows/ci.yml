# Builds and tests the backend and the frontend on every push and pull request (#5).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: leoway
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: leoway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leoway" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Check docs/api/openapi.yaml is up to date
        working-directory: .
        run: |
          git diff --exit-code docs/api/openapi.yaml || {
            echo "::error::docs/api/openapi.yaml is outdated. Run 'mvn -f backend/pom.xml package' and commit it."; exit 1; }
      # Starts the packaged API against a fresh PostgreSQL: catches broken Flyway migrations.
      - name: Start API and check readiness
        env:
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/leoway
          QUARKUS_DATASOURCE_USERNAME: leoway
          QUARKUS_DATASOURCE_PASSWORD: ci
          QUARKUS_FLYWAY_MIGRATE_AT_START: "true"
          LEOWAY_KEY_ENCRYPTION_KEY: Y2ktb25seS1rZXktY2ktb25seS1rZXktY2ktb25seTE=
        run: |
          java -jar target/quarkus-app/quarkus-run.jar > api.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health/ready; then echo; exit 0; fi
            sleep 2
          done
          echo "::error::API did not become ready"; cat api.log; exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test
        run: npx ng test --watch=false
      - name: Build
        run: npx ng build

  # Deploy scripts and workflows run on the server and in Actions with no other tests (#83).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck deploy scripts
        run: shellcheck -x deploy/*.sh
      - name: actionlint workflows
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -no-color
