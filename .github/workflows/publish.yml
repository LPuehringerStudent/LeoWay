# Publishes the production images after CI passed on main (#83). The server pulls them (deploy/auto-deploy.sh),
# so GitHub needs no access to the server.
name: Publish images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # Only pushes to main, never pull requests (workflow_run also fires for those).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/lpuehringerstudent
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short commit id
        run: echo "TAG=${SHA::7}" >> "$GITHUB_ENV"

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/leoway-backend:${{ env.TAG }},${{ env.REGISTRY }}/leoway-backend:main
          labels: |
            org.opencontainers.image.revision=${{ env.TAG }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.REGISTRY }}/leoway-web:${{ env.TAG }},${{ env.REGISTRY }}/leoway-web:main
          labels: |
            org.opencontainers.image.revision=${{ env.TAG }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
