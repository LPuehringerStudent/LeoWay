quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false

# Keep the health URLs used by the local frontend and monitoring.
quarkus.smallrye-health.liveness-path=/health/live
quarkus.smallrye-health.readiness-path=/api/health/ready
quarkus.smallrye-health.openapi.included=true

%local.quarkus.http.host=localhost
%local.quarkus.http.port=5080
%local.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/leoway
%local.quarkus.datasource.username=leoway
%local.quarkus.flyway.migrate-at-start=true
# Older local databases can contain the previous skeleton's migration history.
%local.quarkus.flyway.baseline-on-migrate=true
%local.quarkus.flyway.baseline-version=0
