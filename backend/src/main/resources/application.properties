quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false

# Keep the health URLs used by the local frontend and monitoring.
quarkus.smallrye-health.liveness-path=/health/live
quarkus.smallrye-health.readiness-path=/api/health/ready
quarkus.smallrye-health.openapi.included=true

%local.quarkus.http.host=localhost
%local.quarkus.http.port=5080
%local.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/leoway
%local.quarkus.datasource.username=leoway
%local.quarkus.flyway.migrate-at-start=true
# Older local databases can contain the previous skeleton's migration history.
%local.quarkus.flyway.baseline-on-migrate=true
%local.quarkus.flyway.baseline-version=0

# Flyway owns the schema. Hibernate never changes it.
quarkus.hibernate-orm.schema-management.strategy=none

# Tests start a throwaway PostgreSQL, matching docker-compose.yml, and check entities against the migrations.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:17.11
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.hibernate-orm.schema-management.strategy=validate

# OpenAPI (M04). The build writes docs/api/openapi.yaml; CI fails if the committed copy is outdated.
quarkus.smallrye-openapi.info-title=LeoWay API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=Backend of LeoWay, the commute assistant for HTL Leonding.
quarkus.smallrye-openapi.store-schema-directory=../docs/api
quarkus.smallrye-openapi.store-schema-file-name=openapi
# Swagger UI at /q/swagger-ui in dev mode and for the packaged API with the local profile.
%local.quarkus.swagger-ui.always-include=true

# WebUntis (#7). Production reads LEOWAY_KEY_ENCRYPTION_KEY from the environment (deploy/.env).
leoway.webuntis.base-url=https://htl-leonding.webuntis.com
leoway.webuntis.school=htl-leonding
# Fixed development key, never used in production: local data is throwaway.
%local.leoway.key-encryption-key=${LEOWAY_KEY_ENCRYPTION_KEY:bG9jYWwtZGV2LWtleS1ub3QtZm9yLXByb2R1Y3Rpb24=}
%test.leoway.key-encryption-key=dGVzdC1rZXktdGVzdC1rZXktdGVzdC1rZXktMTIzNDU=
%test.leoway.webuntis.base-url=http://localhost:18765

# Background timetable sync (#59), Europe/Vienna, Quartz cron. Evening for the next day, two morning runs for
# today, noon for lateness entries. Kept low until school IT agrees on a sync frequency (L04, spec 5.2).
leoway.sync.evening=0 0 20 ? * SUN-THU
leoway.sync.morning-early=0 45 5 ? * MON-FRI
leoway.sync.morning-late=0 30 6 ? * MON-FRI
leoway.sync.lateness=0 0 12 ? * MON-FRI
# Tests call TimetableSync directly.
%test.leoway.sync.evening=off
%test.leoway.sync.morning-early=off
%test.leoway.sync.morning-late=off
%test.leoway.sync.lateness=off

# Login (#20): form auth with the WebUntis username and access key, checked by WebUntisIdentityProvider.
# No login/error/landing pages: the Angular app posts to /j_security_check and gets 200 or 401.
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.cookie-name=leoway-session
quarkus.http.auth.form.cookie-same-site=strict
quarkus.http.auth.form.http-only-cookie=true
# Stay logged in for 30 days of inactivity; the cookie is renewed at most once a day.
quarkus.http.auth.form.timeout=P30D
quarkus.http.auth.form.new-cookie-interval=P1D
# Encrypts the session cookie. Production: LEOWAY_SESSION_KEY in deploy/.env; it must survive restarts.
quarkus.http.auth.session.encryption-key=${LEOWAY_SESSION_KEY:}
%local.quarkus.http.auth.session.encryption-key=local-dev-session-key-not-for-production
%test.quarkus.http.auth.session.encryption-key=test-session-key-test-session-key
# WebUntis usernames with the admin role (feeds and health only), comma-separated.
leoway.admins=${LEOWAY_ADMINS:}
%test.leoway.admins=root.admin
%test.leoway.feeds.linz-ag.enabled=false
