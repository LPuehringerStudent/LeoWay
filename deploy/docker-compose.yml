# LeoWay production stack (interim host: R740, CT 104 "leoway").
# Same file is meant to work on LeoCloud later: all settings come from .env.
#
#   cd /opt/leoway/deploy && docker compose up -d
#
# Images are built on a developer machine and loaded onto the host with ./ship.sh (see README).

name: leoway

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leoway}
      POSTGRES_USER: ${POSTGRES_USER:-leoway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    # Only reachable from the container itself; the backend talks to it over the compose network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: leoway-backend:${LEOWAY_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-leoway}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-leoway}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      LEOWAY_PUBLIC_BASE_URL: ${LEOWAY_PUBLIC_BASE_URL}
      # Behind nginx and the Cloudflare Tunnel: take scheme and client IP from X-Forwarded-* headers.
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      QUARKUS_HTTP_PROXY_ALLOW_X_FORWARDED: "true"
      LEOWAY_KEY_ENCRYPTION_KEY: ${LEOWAY_KEY_ENCRYPTION_KEY:?set LEOWAY_KEY_ENCRYPTION_KEY in .env}
      LEOWAY_SESSION_KEY: ${LEOWAY_SESSION_KEY:?set LEOWAY_SESSION_KEY in .env}
      LEOWAY_ADMINS: ${LEOWAY_ADMINS:-}
    # No port: only the web container talks to it.

  web:
    image: leoway-web:${LEOWAY_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Plain HTTP on the home LAN (Uptime Kuma). Public HTTPS: Cloudflare Tunnel r740 -> here.
    ports:
      - "${LEOWAY_HTTP_PORT:-8080}:80"

volumes:
  db-data:
