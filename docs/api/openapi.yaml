---
openapi: 3.1.0
components:
  schemas:
    FeedHealth:
      type: object
      properties:
        feedId:
          type: string
        state:
          $ref: "#/components/schemas/State"
        lastSuccessAt:
          $ref: "#/components/schemas/Instant"
        lastErrorAt:
          $ref: "#/components/schemas/Instant"
        lastError:
          type: string
    FirstLesson:
      type: object
      properties:
        date:
          $ref: "#/components/schemas/LocalDate"
        start:
          $ref: "#/components/schemas/LocalTime"
        subject:
          type: string
    Instant:
      type: string
      format: date-time
      examples:
      - 2022-03-10T16:15:50Z
    LocalDate:
      type: string
      format: date
      examples:
      - 2022-03-10
    LocalTime:
      type: string
      format: local-time
      examples:
      - 13:45:30.123456789
      externalDocs:
        description: As defined by 'partial-time' in RFC3339
        url: https://www.rfc-editor.org/rfc/rfc3339.html#section-5.6
    Me:
      type: object
      properties:
        username:
          type: string
        createdAt:
          $ref: "#/components/schemas/Instant"
    Reachability:
      type: object
      properties:
        webUntisReachable:
          type: boolean
    Route:
      type: object
      properties:
        id:
          type: integer
          format: int64
        homeStopId:
          type: string
        schoolStopId:
          type: string
        walkToStopMinutes:
          type: integer
          format: int32
        walkToSchoolMinutes:
          type: integer
          format: int32
        bufferMinutes:
          type: integer
          format: int32
    State:
      type: string
      enum:
      - OK
      - STALE
      - DOWN
    Status:
      type: object
      properties:
        connected:
          type: boolean
        username:
          type: string
        available:
          type: boolean
        firstLesson:
          $ref: "#/components/schemas/FirstLesson"
    HealthResponse:
      type: object
      properties:
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
        status:
          type: string
          enum:
          - UP
          - DOWN
    HealthCheck:
      type: object
      properties:
        data:
          type:
          - object
          - "null"
        name:
          type: string
        status:
          type: string
          enum:
          - UP
          - DOWN
paths:
  /api/admin/feeds:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedHealth"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: List
      tags:
      - Admin Feeds Resource
      security:
      - SecurityScheme:
        - admin
  /api/health/feeds:
    get:
      summary: Report whether every configured feed is OK
      tags:
      - Health
      responses:
        "200":
          description: All feeds are OK
          content:
            application/json:
              schema: {}
        "503":
          description: "At least one feed is STALE, DOWN or has no status yet"
  /api/me:
    get:
      summary: Show the logged-in student
      tags:
      - Account
      responses:
        "200":
          description: The student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Not logged in
        "403":
          description: "No student account, or an administrator"
      security:
      - SecurityScheme:
        - student
    delete:
      summary: Delete the account and all private data
      description: "Removes the WebUntis key, saved routes and lateness entries (L02,\
        \ L03)."
      tags:
      - Account
      responses:
        "204":
          description: Deleted
        "401":
          description: Not logged in
        "403":
          description: "No student account, or an administrator"
      security:
      - SecurityScheme:
        - student
  /api/me/routes:
    get:
      summary: List the student's saved routes
      tags:
      - Routes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Route"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
  /api/me/routes/{id}:
    get:
      summary: Show one saved route
      tags:
      - Routes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No such route for this student
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
    delete:
      summary: Delete one saved route
      tags:
      - Routes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Deleted
        "404":
          description: No such route for this student
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
  /api/me/webuntis:
    get:
      summary: Connection status and the next first lesson (today or the next school
        day)
      tags:
      - WebUntis
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
    delete:
      summary: "Disconnect WebUntis: deletes the stored access key"
      tags:
      - WebUntis
      responses:
        "204":
          description: Disconnected
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
  /api/session/logout:
    post:
      summary: "Log out: removes the session cookie"
      tags:
      - Session
      responses:
        "204":
          description: Logged out
        "401":
          description: Not logged in
        "403":
          description: Not Allowed
      security:
      - SecurityScheme: []
  /api/session/webuntis-reachable:
    get:
      summary: Whether WebUntis can be reached right now (no login needed)
      tags:
      - Session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reachability"
  /q/health:
    description: MicroProfile Health Endpoint
    summary: MicroProfile Health provides a way for your application to distribute
      information about its healthiness state to state whether or not it is able to
      function properly
    get:
      operationId: microprofile_health_root
      description: Check the health of the application
      tags:
      - MicroProfile Health
      summary: "An aggregated view of the Liveness, Readiness and Startup of this\
        \ application"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/live:
    description: MicroProfile Health - Liveness Endpoint
    summary: Liveness checks are utilized to tell whether the application should be
      restarted
    get:
      operationId: microprofile_health_liveness
      description: Check the liveness of the application
      tags:
      - MicroProfile Health
      summary: The Liveness check of this application
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/health/ready:
    description: MicroProfile Health - Readiness Endpoint
    summary: Readiness checks are used to tell whether the application is able to
      process requests
    get:
      operationId: microprofile_health_readiness
      description: Check the readiness of the application
      tags:
      - MicroProfile Health
      summary: The Readiness check of this application
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /q/health/started:
    description: MicroProfile Health - Startup Endpoint
    summary: Startup checks are an used to tell when the application has started
    get:
      operationId: microprofile_health_startup
      description: Check the startup of the application
      tags:
      - MicroProfile Health
      summary: The Startup check of this application
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
tags:
- name: Account
  description: The logged-in student's own account.
- name: Health
  description: Health checks for monitoring.
- name: Routes
  description: The student's saved routes. Other students' routes always look missing
    (404).
- name: Session
  description: "Login: POST /j_security_check with j_username and j_password (the\
    \ WebUntis access key)."
- name: WebUntis
  description: The logged-in student's WebUntis connection (F01).
- name: MicroProfile Health
  description: Check the health of the application
info:
  title: LeoWay API
  version: 0.1.0
  description: "Backend of LeoWay, the commute assistant for HTL Leonding."
servers:
- url: http://localhost:8080
  description: Auto generated value
- url: http://0.0.0.0:8080
  description: Auto generated value
