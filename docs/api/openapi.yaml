---
openapi: 3.1.0
components:
  schemas:
    AlertChannelStatus:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/Kind"
        working:
          type: boolean
        since:
          $ref: "#/components/schemas/Instant"
        brokenAt:
          $ref: "#/components/schemas/Instant"
    DiscordInput:
      type: object
      required:
      - webhookUrl
      properties:
        webhookUrl:
          type: string
          description: Webhook URL from the Discord channel's Integrations settings
    Errors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
    FeedHealth:
      type: object
      properties:
        feedId:
          type: string
        state:
          $ref: "#/components/schemas/State"
        lastSuccessAt:
          $ref: "#/components/schemas/Instant"
        lastErrorAt:
          $ref: "#/components/schemas/Instant"
        lastError:
          type: string
    FirstLesson:
      type: object
      properties:
        date:
          $ref: "#/components/schemas/LocalDate"
        start:
          $ref: "#/components/schemas/LocalTime"
        subject:
          type: string
    Instant:
      type: string
      format: date-time
      examples:
      - 2022-03-10T16:15:50Z
    Kind:
      type: string
      enum:
      - DISCORD
    LeaveByConnection:
      type: object
      properties:
        line:
          type: string
        plannedDeparture:
          $ref: "#/components/schemas/OffsetDateTime"
        departure:
          $ref: "#/components/schemas/OffsetDateTime"
        plannedArrival:
          $ref: "#/components/schemas/OffsetDateTime"
        arrival:
          $ref: "#/components/schemas/OffsetDateTime"
    LeaveByResult:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/LeaveByStatus"
        routeId:
          type: integer
          format: int64
        lessonStart:
          $ref: "#/components/schemas/OffsetDateTime"
        leaveAt:
          $ref: "#/components/schemas/OffsetDateTime"
        atSchool:
          $ref: "#/components/schemas/OffsetDateTime"
        connection:
          $ref: "#/components/schemas/LeaveByConnection"
        source:
          $ref: "#/components/schemas/Source"
        minutesLate:
          type: integer
          format: int64
    LeaveByStatus:
      description: |-
        IN_TIME: the latest connection that arrives in time, buffer included.
        NO_BUFFER: none leaves room for the buffer; this one still arrives by the lesson start.
        LATE: every connection arrives after the lesson starts; this one arrives earliest (minutesLate).
        NO_CONNECTION: no connection that can still be reached.
        NO_ROUTE, NO_LESSON (none in the next week), NOT_CONNECTED, NEEDS_RECONNECT (WebUntis key rejected):
        nothing to calculate.
      type: string
      enum:
      - IN_TIME
      - NO_BUFFER
      - LATE
      - NO_CONNECTION
      - NO_ROUTE
      - NO_LESSON
      - NOT_CONNECTED
      - NEEDS_RECONNECT
    LocalDate:
      type: string
      format: date
      examples:
      - 2022-03-10
    LocalTime:
      type: string
      format: local-time
      examples:
      - 13:45:30.123456789
      externalDocs:
        description: As defined by 'partial-time' in RFC3339
        url: https://www.rfc-editor.org/rfc/rfc3339.html#section-5.6
    Me:
      type: object
      properties:
        username:
          type: string
        createdAt:
          $ref: "#/components/schemas/Instant"
    OffsetDateTime:
      type: string
      format: date-time
      examples:
      - 2022-03-10T12:15:50-04:00
    Reachability:
      type: object
      properties:
        webUntisReachable:
          type: boolean
    Route:
      type: object
      properties:
        id:
          type: integer
          format: int64
        homeStopId:
          type: string
        schoolStopId:
          type: string
        walkToStopMinutes:
          type: integer
          format: int32
        walkToSchoolMinutes:
          type: integer
          format: int32
        bufferMinutes:
          type: integer
          format: int32
    RouteInput:
      type: object
      required:
      - homeStopId
      - schoolStopId
      - walkToStopMinutes
      - walkToSchoolMinutes
      properties:
        homeStopId:
          type: string
          description: Stop id from GET /api/stops
          examples:
          - "60501720"
        schoolStopId:
          type: string
          description: Stop id from GET /api/stops
          examples:
          - "60500120"
        walkToStopMinutes:
          type: integer
          format: int32
          maximum: 60
          minimum: 0
        walkToSchoolMinutes:
          type: integer
          format: int32
          maximum: 60
          minimum: 0
        bufferMinutes:
          type: integer
          format: int32
          maximum: 30
          minimum: 0
          default: 5
    Session:
      type: object
      properties:
        username:
          type: string
        admin:
          type: boolean
    Source:
      type: string
      enum:
      - TIMETABLE
      - PREDICTION
    State:
      type: string
      enum:
      - OK
      - STALE
      - DOWN
    Status:
      type: object
      properties:
        connected:
          type: boolean
        username:
          type: string
        available:
          type: boolean
        firstLesson:
          $ref: "#/components/schemas/FirstLesson"
        needsReconnect:
          type: boolean
        syncedAt:
          $ref: "#/components/schemas/Instant"
    Stop:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    HealthResponse:
      type: object
      properties:
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
        status:
          type: string
          enum:
          - UP
          - DOWN
    HealthCheck:
      type: object
      properties:
        data:
          type:
          - object
          - "null"
        name:
          type: string
        status:
          type: string
          enum:
          - UP
          - DOWN
paths:
  /api/admin/feeds:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedHealth"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: List
      tags:
      - Admin Feeds Resource
      security:
      - SecurityScheme:
        - admin
  /api/health/feeds:
    get:
      summary: Report whether every configured feed is OK
      tags:
      - Health
      responses:
        "200":
          description: All feeds are OK
          content:
            application/json:
              schema: {}
        "503":
          description: "At least one feed is STALE, DOWN or has no status yet"
  /api/me:
    get:
      summary: Show the logged-in student
      tags:
      - Account
      responses:
        "200":
          description: The student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Not logged in
        "403":
          description: "No student account, or an administrator"
      security:
      - SecurityScheme:
        - student
    delete:
      summary: Delete the account and all private data
      description: "Removes the WebUntis key, saved routes and lateness entries (L02,\
        \ L03)."
      tags:
      - Account
      responses:
        "204":
          description: Deleted
        "401":
          description: Not logged in
        "403":
          description: "No student account, or an administrator"
      security:
      - SecurityScheme:
        - student
  /api/me/alerts:
    get:
      summary: List the student's alert channels
      description: Working or broken; never the target.
      tags:
      - Alerts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertChannelStatus"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
  /api/me/alerts/discord:
    put:
      summary: Set the Discord webhook
      description: Sends a test message to it and only stores it if Discord accepts
        it. Replaces an older one.
      tags:
      - Alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordInput"
        required: true
      responses:
        "200":
          description: Stored; the test message was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertChannelStatus"
        "400":
          description: "Not a Discord webhook URL, or Discord refused it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "429":
          description: A test message was sent less than 10 s ago; see Retry-After
        "503":
          description: Discord can't be reached; nothing was stored
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
  /api/me/alerts/{kind}:
    delete:
      summary: Remove an alert channel
      tags:
      - Alerts
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed (or was not set)
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
  /api/me/alerts/{kind}/test:
    post:
      summary: Send the test message again
      tags:
      - Alerts
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertChannelStatus"
        "404":
          description: No such channel
        "409":
          description: The channel refused it and is now marked broken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "429":
          description: A test message was sent less than 10 s ago; see Retry-After
        "503":
          description: The channel can't be reached right now
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
  /api/me/leave-by:
    get:
      summary: Leave-by time for the next first lesson
      description: "Uses the student's first saved route unless routeId is given.\
        \ The lesson comes from the last timetable sync (#59); connections from Linz\
        \ AG, with real-time data close to the trip."
      tags:
      - Leave-by
      parameters:
      - description: Saved route; default the first one
        name: routeId
        in: query
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: The result; see status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveByResult"
        "404":
          description: routeId is not one of the student's routes
        "503":
          description: WebUntis or the connection source can't be reached; Retry-After
            (seconds) if the source is only busy
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
  /api/me/routes:
    get:
      summary: List the student's saved routes
      tags:
      - Routes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Route"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
    post:
      summary: Save a new route
      tags:
      - Routes
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteInput"
        required: true
      responses:
        "201":
          description: Saved; Location points to the new route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: "Invalid stops, walking times or buffer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
  /api/me/routes/{id}:
    put:
      summary: Change one saved route
      tags:
      - Routes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteInput"
        required: true
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          description: "Invalid stops, walking times or buffer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "404":
          description: No such route for this student
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
    get:
      summary: Show one saved route
      tags:
      - Routes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No such route for this student
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
    delete:
      summary: Delete one saved route
      tags:
      - Routes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Deleted
        "404":
          description: No such route for this student
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
  /api/me/webuntis:
    get:
      summary: Connection status and the next first lesson (today or the next school
        day)
      description: Served from the last background sync; WebUntis is only asked if
        that is outdated (#59).
      tags:
      - WebUntis
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
    delete:
      summary: "Disconnect WebUntis: deletes the stored access key"
      tags:
      - WebUntis
      responses:
        "204":
          description: Disconnected
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
  /api/session:
    get:
      summary: Show the current session and whether it can access administration
      tags:
      - Session
      responses:
        "200":
          description: The authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Not logged in
        "403":
          description: Not Allowed
      security:
      - SecurityScheme: []
  /api/session/logout:
    post:
      summary: "Log out: removes the session cookie"
      tags:
      - Session
      responses:
        "204":
          description: Logged out
        "401":
          description: Not logged in
        "403":
          description: Not Allowed
      security:
      - SecurityScheme: []
  /api/session/webuntis-reachable:
    get:
      summary: Whether WebUntis can be reached right now (no login needed)
      tags:
      - Session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reachability"
  /api/stops:
    get:
      summary: "Search stops by name, best matches first (at most 10)"
      tags:
      - Stops
      parameters:
      - description: "Part of the stop name, e.g. Meixnerkr"
        name: q
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Matching stops; empty if none match
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stop"
        "400":
          description: "q is missing, shorter than 2 or longer than 60 characters"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "429":
          description: Too many new searches right now; see Retry-After (seconds)
        "503":
          description: The Linz AG stop finder can't be reached
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - student
  /q/health:
    description: MicroProfile Health Endpoint
    summary: MicroProfile Health provides a way for your application to distribute
      information about its healthiness state to state whether or not it is able to
      function properly
    get:
      operationId: microprofile_health_root
      description: Check the health of the application
      tags:
      - MicroProfile Health
      summary: "An aggregated view of the Liveness, Readiness and Startup of this\
        \ application"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/live:
    description: MicroProfile Health - Liveness Endpoint
    summary: Liveness checks are utilized to tell whether the application should be
      restarted
    get:
      operationId: microprofile_health_liveness
      description: Check the liveness of the application
      tags:
      - MicroProfile Health
      summary: The Liveness check of this application
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/health/ready:
    description: MicroProfile Health - Readiness Endpoint
    summary: Readiness checks are used to tell whether the application is able to
      process requests
    get:
      operationId: microprofile_health_readiness
      description: Check the readiness of the application
      tags:
      - MicroProfile Health
      summary: The Readiness check of this application
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /q/health/started:
    description: MicroProfile Health - Startup Endpoint
    summary: Startup checks are an used to tell when the application has started
    get:
      operationId: microprofile_health_startup
      description: Check the startup of the application
      tags:
      - MicroProfile Health
      summary: The Startup check of this application
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
tags:
- name: Account
  description: The logged-in student's own account.
- name: Alerts
  description: Where the student gets alerts (F04). Targets are never returned.
- name: Health
  description: Health checks for monitoring.
- name: Leave-by
  description: When the student has to leave home (F02).
- name: Routes
  description: The student's saved routes. Other students' routes always look missing
    (404).
- name: Session
  description: "Login: POST /j_security_check with j_username and j_password (the\
    \ WebUntis access key)."
- name: Stops
  description: "Public-transport stops from the Linz AG stop finder. Stops only, no\
    \ addresses."
- name: WebUntis
  description: The logged-in student's WebUntis connection (F01).
- name: MicroProfile Health
  description: Check the health of the application
info:
  title: LeoWay API
  version: 0.1.0
  description: "Backend of LeoWay, the commute assistant for HTL Leonding."
servers:
- url: http://localhost:8080
  description: Auto generated value
- url: http://0.0.0.0:8080
  description: Auto generated value
