server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health/live { proxy_pass http://backend:8080; }

    # Hashed build files never change.
    location ~* \.(js|css|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; }

    # Angular routes: unknown paths load the app.
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}
