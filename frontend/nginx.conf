server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Security headers on every response (#107). Without add_header_inherit merge (nginx 1.29.3+), a location with
    # its own add_header (the Cache-Control ones below) silently drops these.
    add_header_inherit merge;
    add_header X-Content-Type-Options nosniff always;
    # Other sites (OpenStreetMap tiles on the route map, #60) only see https://<host>/, never the path. The OSM tile
    # policy asks for a Referer, so no-referrer would break it.
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health/live { proxy_pass http://backend:8080; }
    # Login (#20): Quarkus form authentication.
    location = /j_security_check {
        proxy_pass http://backend:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files never change.
    location ~* \.(js|css|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; }

    # Angular routes: unknown paths load the app.
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}
