<!doctype html>
<html><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LeoWay alarm spike</title>
    <style>body{font:16px sans-serif;margin:12px}button{display:block;width:100%;margin:6px 0;padding:12px}pre{white-space:pre-wrap;font-size:12px}</style>
</head><body>
<h3>Alarm spike</h3>
<button onclick="setIn(2,'alarmClock',true)">Alarm in 2 min (setAlarmClock)</button>
<button onclick="setIn(2,'exactIdle',true)">Alarm in 2 min (setExactAndAllowWhileIdle)</button>
<button onclick="setIn(4,null,true)">Simulate push: move to +4 min (newer version)</button>
<button onclick="setIn(1,null,false)">Simulate OLD push (must be ignored)</button>
<button onclick="A().requestNotifications().then(show)">Allow notifications</button>
<button onclick="A().openExactAlarmSettings()">Open exact-alarm settings</button>
<button onclick="show()">Refresh status</button>
<pre id="out"></pre>
<script>
    const A = () => Capacitor.Plugins.LeoAlarm;
    let lastMode = 'alarmClock', version = 0;
    async function setIn(min, mode, newer) {
        const s = await A().getStatus();
        version = newer ? Math.max(version, s.version) + 1 : Math.max(0, s.version - 1);
        if (mode) lastMode = mode;
        const r = await A().setAlarm({ time: Date.now() + min * 60000, version, mode: lastMode });
        await show(r.result);
    }
    async function show(extra) {
        const s = await A().getStatus();
        const f = t => t ? new Date(t).toLocaleTimeString() : '-';
        out.textContent = `SDK ${s.sdk} | exact alarms: ${s.canExact} | notifications: ${s.notificationsOn}\n` +
            `alarm: ${f(s.time)} (v${s.version}) | last fired: ${f(s.firedAt)}\n${extra || ''}\n\n` +
            s.log.split('\n').map(l => { const [t, ...r] = l.split(' '); return f(+t) + ' ' + r.join(' '); }).join('\n');
    }
    document.addEventListener('DOMContentLoaded', () => show());
</script></body></html>
